# Modular RAG MCP Server - Configuration

# =============================================================================
# LLM Configuration
# =============================================================================
llm:
  provider: openai
  model: qwen3.5-plus
  base_url: ${LLM_BASE_URL:-https://coding.dashscope.aliyuncs.com/v1}
  api_key: ${LLM_API_KEY:-}
  timeout: 45
  max_retries: 2
  retry_backoff_seconds: 0.25
  retry_backoff_multiplier: 2.0
  retry_max_backoff_seconds: 2.0

# =============================================================================
# Embedding Configuration
# =============================================================================
embedding:
  # 本地 HuggingFace 向量模型（固定使用项目内目录，避免运行时依赖外网）
  provider: huggingface_local
  model: data/models/all-MiniLM-L6-v2
  device: cpu
  batch_size: 32
  normalize_embeddings: false

# =============================================================================
# Vector Store Configuration
# =============================================================================
vector_store:
  provider: chroma
  persist_dir: data/db/chroma

# =============================================================================
# Retrieval Configuration
# =============================================================================
retrieval:
  top_k: 8
  sparse_top_k: 20

# =============================================================================
# Rerank Configuration
# =============================================================================
rerank:
  enabled: false
  provider: none  # none / cross_encoder / llm
  top_m: 30
  timeout: 10.0

# =============================================================================
# Vision LLM Configuration (for Image Captioning)
# =============================================================================
vision_llm:
  enabled: true
  provider: dashscope
  model: qwen3.5-plus
  base_url: ${VISION_LLM_BASE_URL:-https://coding.dashscope.aliyuncs.com/v1}
  api_key: ${VISION_LLM_API_KEY:-}
  max_image_size: 2048
  timeout: 45
  max_retries: 2
  retry_backoff_seconds: 0.25
  retry_backoff_multiplier: 2.0
  retry_max_backoff_seconds: 2.0

# =============================================================================
# Evaluation Configuration
# =============================================================================
evaluation:
  provider: ragas
  enabled: false

# =============================================================================
# Observability Configuration
# =============================================================================
observability:
  log_level: INFO
  trace_file: logs/traces.jsonl

# =============================================================================
# Ingestion Configuration
# =============================================================================
ingestion:
  splitter: recursive
  chunk_size: 1000
  chunk_overlap: 200
  batch_size: 100

  # Chunk Refiner Configuration (C5)
  chunk_refiner:
    use_llm: true
    # prompt_path: config/prompts/chunk_refinement.txt

  # Metadata Enricher Configuration (C6)
  metadata_enricher:
    use_llm: true

