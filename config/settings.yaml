llm:
  provider: openai
  model: gpt-4o-mini

embedding:
  provider: openai
  model: text-embedding-3-small

vector_store:
  provider: chroma
  persist_dir: data/db/chroma

retrieval:
  top_k: 8
  sparse_top_k: 20

rerank:
  provider: none
  enabled: false
  top_m: 30

# Vision LLM: 国内/国外双模型可配置切换
# - azure: Azure OpenAI 视觉模型（如 gpt-4o）
# - dashscope: 阿里百炼视觉模型（如 qwen3.5-plus）
vision_llm:
  provider: dashscope
  model: qwen3.5-plus
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  max_image_size: 2048
  timeout: 30

evaluation:
  provider: ragas
  enabled: false

observability:
  log_level: INFO
  trace_file: logs/traces.jsonl
