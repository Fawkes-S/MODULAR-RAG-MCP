[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modular-rag-mcp"
version = "0.1.0"
description = "Modular RAG MCP server skeleton"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["mcp", "rag", "retrieval", "llm", "knowledge-base"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "pyyaml>=6.0.3",
  "langchain-text-splitters>=0.3.0",
  "chromadb>=0.5.0",
  "pymupdf>=1.27.2.2",
  "markitdown[pdf]>=0.1.5",
  "sentence-transformers>=3.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=4.0.0",
  "pytest-mock>=3.14.0",
  "ruff>=0.6.0",
  "mypy>=1.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q -p no:cacheprovider"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "unit: Unit tests (fast, no external dependencies)",
  "integration: Integration tests (may require external services)",
  "e2e: End-to-end tests (full system tests)",
  "llm: tests that require real LLM API calls",
  "slow: Slow tests that should be run less frequently",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true